services:
  - type: web
    name: servicenow-mcp
    runtime: docker
    repo: https://github.com/YOUR_GITHUB_USERNAME/servicenow-mcp
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SERVICENOW_INSTANCE_URL
        sync: false
      - key: SERVICENOW_USERNAME
        sync: false
      - key: SERVICENOW_PASSWORD
        sync: false
      - key: SERVICENOW_AUTH_TYPE
        value: basic
      - key: MCP_TOOL_PACKAGE
        value: full
      - key: SERVICENOW_CLIENT_ID
        sync: false
      - key: SERVICENOW_CLIENT_SECRET
        sync: false
      - key: SERVICENOW_TOKEN_URL
        sync: false
      - key: SERVICENOW_API_KEY
        sync: false
    plan: free
    region: oregon
    healthCheckPath: /sse
